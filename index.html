<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 앱 설정 -->
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="manifest" href="./manifest.json">

  <title>Login System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .main {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background: #222;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    }

    .main h1 {
      margin-bottom: 10px;
    }

    .main p {
      color: #bbb;
      margin-bottom: 30px;
    }

    .menu-button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #444;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .menu-button:hover {
      background: #555;
    }

    /* 팝업 배경 */

    .popup-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 9999;
      overflow-y: auto;
    }

    .popup-background.show {
      display: flex;
    }

    /* 팝업 */

    .login-box,
    .add-box,
    .edit-box {
      width: 100%;
      max-width: 420px;
      background: #222;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      margin: auto;
      position: relative;
    }

    .add-box,
    .edit-box {
      max-height: calc(100vh - 30px);
      overflow-y: auto;
    }

    /* 제목 */

    .popup-title {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    /* 입력칸 */

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #ddd;
    }

    .input-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #999;
    }

    /* 기본 버튼 */

    .action-button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      background: #eee;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-button:hover {
      background: #ccc;
    }

    /* 닫기 */

    .close-button {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      position: relative;
      width: 100%;
      min-height: 45px;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #555;
      color: white;
      font-size: 15px;
      cursor: pointer;
      z-index: 10000;
    }

    .close-button:hover {
      background: #666;
    }

    /* 계정 목록 */

    .account-list {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #444;
    }

    .account-list h3 {
      margin-top: 0;
      font-size: 16px;
    }

    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .account-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* 수정 */

    .edit-button {
      border: none;
      border-radius: 6px;
      background: #666;
      color: white;
      padding: 7px 11px;
      cursor: pointer;
    }

    .edit-button:hover {
      background: #777;
    }

    /* 삭제 */

    .delete-button {
      border: none;
      border-radius: 6px;
      background: #444;
      color: white;
      padding: 7px 11px;
      cursor: pointer;
    }

    .delete-button:hover {
      background: #555;
    }

    /* 모바일 */

    @media (max-width: 500px) {

      .popup-background {
        align-items: flex-start;
        padding: 10px;
      }

      .login-box,
      .add-box,
      .edit-box {
        margin-top: 10px;
        margin-bottom: 10px;
        padding: 20px;
        max-height: calc(100vh - 20px);
      }

      .popup-title {
        margin-bottom: 20px;
      }

      .account {
        padding: 9px;
      }

      .account-buttons {
        gap: 4px;
      }

      .edit-button,
      .delete-button {
        padding: 7px 9px;
        font-size: 13px;
      }
    }

  </style>
</head>


<body>

  <!-- 처음 화면 -->

  <div class="container">

    <div class="main">

      <h1>Login System</h1>

      <p>원하는 서비스를 선택하세요.</p>

      <button
        class="menu-button"
        id="loginUIButton">
        로그인
      </button>

      <button
        class="menu-button"
        id="addUIButton">
        추가
      </button>

    </div>

  </div>


  <!-- 로그인 팝업 -->

  <div
    class="popup-background"
    id="loginPopup">

    <div class="login-box">

      <h2 class="popup-title">
        로그인
      </h2>

      <div class="input-group">

        <label>
          아이디
        </label>

        <input
          type="text"
          id="username"
          placeholder="아이디를 입력하세요"
          autocomplete="username">

      </div>


      <div class="input-group">

        <label>
          비밀번호
        </label>

        <input
          type="password"
          id="password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password">

      </div>


      <button
        type="button"
        class="action-button"
        id="loginButton">

        로그인

      </button>


      <button
        type="button"
        class="close-button"
        id="closeLoginButton">

        닫기

      </button>

    </div>

  </div>


  <!-- 추가 팝업 -->

  <div
    class="popup-background"
    id="addPopup">

    <div class="add-box">

      <h2 class="popup-title">
        계정 추가
      </h2>


      <div class="input-group">

        <label>
          아이디
        </label>

        <input
          type="text"
          id="newUsername"
          placeholder="추가할 아이디"
          autocomplete="off">

      </div>


      <div class="input-group">

        <label>
          비밀번호
        </label>

        <input
          type="password"
          id="newPassword"
          placeholder="비밀번호를 입력하세요"
          autocomplete="new-password">

      </div>


      <div class="input-group">

        <label>
          로그인 후 이동할 URL
        </label>

        <input
          type="url"
          id="newURL"
          placeholder="https://example.com">

      </div>


      <button
        type="button"
        class="action-button"
        id="addButton">

        추가

      </button>


      <button
        type="button"
        class="close-button"
        id="closeAddButton">

        닫기

      </button>


      <div class="account-list">

        <h3>
          현재 등록된 계정
        </h3>

        <div id="accountList"></div>

      </div>

    </div>

  </div>


  <!-- 수정 팝업 -->

  <div
    class="popup-background"
    id="editPopup">

    <div class="edit-box">

      <h2 class="popup-title">
        계정 수정
      </h2>


      <div class="input-group">

        <label>
          아이디
        </label>

        <input
          type="text"
          id="editUsername"
          placeholder="아이디"
          autocomplete="off">

      </div>


      <div class="input-group">

        <label>
          비밀번호
        </label>

        <input
          type="password"
          id="editPassword"
          placeholder="비밀번호"
          autocomplete="new-password">

      </div>


      <div class="input-group">

        <label>
          로그인 후 이동할 URL
        </label>

        <input
          type="url"
          id="editURL"
          placeholder="https://example.com">

      </div>


      <button
        type="button"
        class="action-button"
        id="saveEditButton">

        수정 저장

      </button>


      <button
        type="button"
        class="close-button"
        id="closeEditButton">

        닫기

      </button>

    </div>

  </div>


  <script>

    /* 기본 계정 */

    const defaultAccounts = [

      {
        username: "opgg",
        password: "000",
        url: "https://op.gg/ko/lol/summoners/kr/Korean%20Akali-000"
      },

      {
        username: "kkutu",
        password: "000",
        url: "https://kkutu.kr"
      },

      {
        username: "chatgpt",
        password: "000",
        url: "https://chatgpt.com"
      },

      {
        username: "google",
        password: "000",
        url: "https://www.google.com"
      },

      {
        username: "instagram",
        password: "000",
        url: "https://www.instagram.com"
      },

      {
        username: "naver",
        password: "000",
        url: "https://www.naver.com"
      },

      {
        username: "youtube",
        password: "000",
        url: "https://www.youtube.com"
      }

    ];


    /* 저장된 계정 불러오기 */

    let savedAccounts =
      localStorage.getItem("myLoginAccounts");

    let accounts;


    if (savedAccounts) {

      try {

        accounts =
          JSON.parse(savedAccounts);

      } catch (error) {

        accounts =
          defaultAccounts;

        localStorage.setItem(
          "myLoginAccounts",
          JSON.stringify(accounts)
        );

      }

    } else {

      accounts =
        defaultAccounts;

      localStorage.setItem(
        "myLoginAccounts",
        JSON.stringify(accounts)
      );

    }


    /* HTML 요소 */

    const loginUIButton =
      document.getElementById("loginUIButton");

    const addUIButton =
      document.getElementById("addUIButton");

    const loginPopup =
      document.getElementById("loginPopup");

    const addPopup =
      document.getElementById("addPopup");

    const editPopup =
      document.getElementById("editPopup");

    const closeLoginButton =
      document.getElementById("closeLoginButton");

    const closeAddButton =
      document.getElementById("closeAddButton");

    const closeEditButton =
      document.getElementById("closeEditButton");

    const loginButton =
      document.getElementById("loginButton");

    const addButton =
      document.getElementById("addButton");

    const saveEditButton =
      document.getElementById("saveEditButton");

    const accountList =
      document.getElementById("accountList");


    /* 수정 중인 계정 */

    let editingIndex = -1;


    /* 로그인 입력 초기화 */

    function clearLoginInputs() {

      document.getElementById(
        "username"
      ).value = "";

      document.getElementById(
        "password"
      ).value = "";

    }


    /* 추가 입력 초기화 */

    function clearAddInputs() {

      document.getElementById(
        "newUsername"
      ).value = "";

      document.getElementById(
        "newPassword"
      ).value = "";

      document.getElementById(
        "newURL"
      ).value = "";

    }


    /* 로그인 팝업 열기 */

    loginUIButton.addEventListener(
      "click",
      function() {

        loginPopup.classList.add("show");

        addPopup.classList.remove("show");

        editPopup.classList.remove("show");

      }
    );


    /* 추가 팝업 열기 */

    addUIButton.addEventListener(
      "click",
      function() {

        addPopup.classList.add("show");

        loginPopup.classList.remove("show");

        editPopup.classList.remove("show");

        showAccounts();

      }
    );


    /* 로그인 닫기 */

    closeLoginButton.addEventListener(
      "click",
      function() {

        clearLoginInputs();

        loginPopup.classList.remove("show");

      }
    );


    /* 추가 닫기 */

    closeAddButton.addEventListener(
      "click",
      function() {

        clearAddInputs();

        addPopup.classList.remove("show");

      }
    );


    /* 수정 닫기 */

    closeEditButton.addEventListener(
      "click",
      function() {

        editPopup.classList.remove("show");

      }
    );


    /* 로그인 */

    loginButton.addEventListener(
      "click",
      function() {

        const username =
          document.getElementById(
            "username"
          )
          .value
          .trim();


        const password =
          document.getElementById(
            "password"
          ).value;


        if (!username || !password) {

          alert(
            "아이디와 비밀번호를 입력해주세요."
          );

          clearLoginInputs();

          return;

        }


        const account =
          accounts.find(
            function(item) {

              return (
                item.username === username &&
                item.password === password
              );

            }
          );


        if (account) {

          alert(
            "Welcome, " +
            username +
            "!"
          );


          clearLoginInputs();


          window.open(
            account.url,
            "_blank"
          );

        } else {

          alert(
            "아이디 또는 비밀번호가 올바르지 않습니다."
          );


          clearLoginInputs();

        }

      }
    );


    /* 계정 추가 */

    addButton.addEventListener(
      "click",
      function() {

        const newUsername =
          document.getElementById(
            "newUsername"
          )
          .value
          .trim();


        const newPassword =
          document.getElementById(
            "newPassword"
          ).value;


        const newURL =
          document.getElementById(
            "newURL"
          )
          .value
          .trim();


        if (
          !newUsername ||
          !newPassword ||
          !newURL
        ) {

          alert(
            "아이디, 비밀번호, URL을 모두 입력해주세요."
          );

          clearAddInputs();

          return;

        }


        let validURL;


        try {

          validURL =
            new URL(newURL);

        } catch (error) {

          alert(
            "올바른 URL을 입력해주세요.\n예: https://example.com"
          );

          clearAddInputs();

          return;

        }


        if (
          validURL.protocol !== "http:" &&
          validURL.protocol !== "https:"
        ) {

          alert(
            "http:// 또는 https://로 시작하는 URL을 입력해주세요."
          );

          clearAddInputs();

          return;

        }


        const duplicate =
          accounts.some(
            function(item) {

              return (
                item.username === newUsername
              );

            }
          );


        if (duplicate) {

          alert(
            "이미 존재하는 아이디입니다."
          );

          clearAddInputs();

          return;

        }


        accounts.push({

          username: newUsername,

          password: newPassword,

          url: newURL

        });


        localStorage.setItem(
          "myLoginAccounts",
          JSON.stringify(accounts)
        );


        alert(
          newUsername +
          " 계정이 추가되었습니다!"
        );


        clearAddInputs();


        showAccounts();

      }
    );


    /* 계정 목록 표시 */

    function showAccounts() {

      accountList.innerHTML = "";


      accounts.forEach(
        function(account, index) {

          const div =
            document.createElement("div");

          div.className =
            "account";


          const name =
            document.createElement("span");

          name.className =
            "account-name";

          name.textContent =
            account.username;


          const buttonArea =
            document.createElement("div");

          buttonArea.className =
            "account-buttons";


          const editButton =
            document.createElement("button");

          editButton.className =
            "edit-button";

          editButton.textContent =
            "수정";


          editButton.addEventListener(
            "click",
            function() {

              openEditPopup(index);

            }
          );


          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "delete-button";

          deleteButton.textContent =
            "삭제";


          deleteButton.addEventListener(
            "click",
            function() {

              deleteAccount(index);

            }
          );


          buttonArea.appendChild(
            editButton
          );

          buttonArea.appendChild(
            deleteButton
          );


          div.appendChild(name);

          div.appendChild(buttonArea);


          accountList.appendChild(div);

        }
      );

    }


    /* 수정창 열기 */

    function openEditPopup(index) {

      editingIndex = index;


      const account =
        accounts[index];


      document.getElementById(
        "editUsername"
      ).value =
        account.username;


      document.getElementById(
        "editPassword"
      ).value =
        account.password;


      document.getElementById(
        "editURL"
      ).value =
        account.url;


      addPopup.classList.remove(
        "show"
      );


      loginPopup.classList.remove(
        "show"
      );


      editPopup.classList.add(
        "show"
      );

    }


    /* 수정 저장 */

    saveEditButton.addEventListener(
      "click",
      function() {

        if (editingIndex === -1) {

          return;

        }


        const username =
          document.getElementById(
            "editUsername"
          )
          .value
          .trim();


        const password =
          document.getElementById(
            "editPassword"
          ).value;


        const url =
          document.getElementById(
            "editURL"
          )
          .value
          .trim();


        if (
          !username ||
          !password ||
          !url
        ) {

          alert(
            "아이디, 비밀번호, URL을 모두 입력해주세요."
          );

          return;

        }


        let validURL;


        try {

          validURL =
            new URL(url);

        } catch (error) {

          alert(
            "올바른 URL을 입력해주세요.\n예: https://example.com"
          );

          return;

        }


        if (
          validURL.protocol !== "http:" &&
          validURL.protocol !== "https:"
        ) {

          alert(
            "http:// 또는 https://로 시작하는 URL을 입력해주세요."
          );

          return;

        }


        const duplicate =
          accounts.some(
            function(item, index) {

              return (
                index !== editingIndex &&
                item.username === username
              );

            }
          );


        if (duplicate) {

          alert(
            "이미 존재하는 아이디입니다."
          );

          return;

        }


        accounts[editingIndex] = {

          username: username,

          password: password,

          url: url

        };


        localStorage.setItem(
          "myLoginAccounts",
          JSON.stringify(accounts)
        );


        alert(
          "계정 정보가 수정되었습니다!"
        );


        editingIndex = -1;


        editPopup.classList.remove(
          "show"
        );


        addPopup.classList.add(
          "show"
        );


        showAccounts();

      }
    );


    /* 계정 삭제 */

    function deleteAccount(index) {

      const account =
        accounts[index];


      const confirmed =
        confirm(
          "'" +
          account.username +
          "' 계정을 정말 삭제하시겠습니까?"
        );


      if (!confirmed) {

        return;

      }


      accounts.splice(
        index,
        1
      );


      localStorage.setItem(
        "myLoginAccounts",
        JSON.stringify(accounts)
      );


      alert(
        "계정이 삭제되었습니다."
      );


      showAccounts();

    }


    /* =========================
       PWA 서비스 워커 등록
    ========================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker.register(
            "./sw.js"
          )
          .then(
            function() {

              console.log(
                "앱 기능이 활성화되었습니다."
              );

            }
          )
          .catch(
            function(error) {

              console.log(
                "서비스 워커 등록 실패:",
                error
              );

            }
          );

        }
      );

    }

  </script>

</body>
</html>
